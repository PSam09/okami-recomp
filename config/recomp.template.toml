# Configuração do PS2Recomp para Okami (SLUS_211.15)
# Gerado automaticamente por tools/elf_functions.py

[general]
# Caminho para o executavel ELF
input = "@ELF@"

# Caminho para o mapeamento CSV de funcoes
ghidra_output = "@MAP@"

# Diretorio de saida do codigo C++
output = "@OUT@"

# Modo de saida em arquivo unico
single_file_output = false

# Politica de substituicao
patch_syscalls = false
patch_cop0 = true
patch_cache = true

# Funcoes com stub para chamadas de runtime nativo
stubs = [
  "ResetEE@0x003FE390",
  "Exit@0x003FE3C0",
  "CreateThread@0x003FE5A0",
  "StartThread@0x003FE5C0",
  "ExitThread@0x003FE5D0",
  "TerminateThread@0x003FE5F0",
  "ChangeThreadPriority@0x003FE630",
  "SleepThread@0x003FE6C0",
  "WakeupThread@0x003FE6D0",
  "SetupThread@0x003FE760",
  "SetupContext@0x003FE770",
  "SetupFD@0x003FE7A0",
  "SetupFreeFD@0x003FE7B0",
  "FlushCache@0x003FEA20",
  "SifSetDma@0x003FEB40",
  "SifSetDChain@0x003FEB60",
  "SifSetReg@0x003FEB80",
  "SifGetReg@0x003FEBA0",
]

# Pontos de entrada
entry_points = [
  "entry@0x00100008",
]

# Patches para instrucoes problematicas detectadas no ELF
instruction_patches = [
]
