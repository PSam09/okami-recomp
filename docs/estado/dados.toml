# Dados do mapa de estado visual (docs/estado/mapa.*.svg e docs/estado/detalhes.*.md).
# Para atualizar o gráfico e as tabelas, execute:  python tools/estado/gerar.py
#
# Estados: "ok" (funciona), "parcial" (funciona com pendências ou em teste), "pendiente" (não implementado ainda).

# ---------------------------------------------------------------------------------------------------------
# Painel 1: Bibliotecas estáticas do Sony SDK ligadas no executável SLUS_211.15.
# Cada função em config/funcmap.csv entre `desde` e `hasta` representa uma célula no mapa visual.
# ---------------------------------------------------------------------------------------------------------
