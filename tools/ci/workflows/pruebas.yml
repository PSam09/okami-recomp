name: Pruebas de CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validar_config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar configuracion (funcmap.csv y recomp.template.toml)
        run: |
          python3 tools/ci/validar_config.py
